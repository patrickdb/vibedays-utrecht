name: QA

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(npm ls @playwright/test --json | node -p 'JSON.parse(require("fs").readFileSync(0)).dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Write .env with dummy secrets
        run: |
          cat > .env <<ENV
          DATABASE_URL=file:./data/ci.db
          OPENROUTER_API_KEY=sk-or-dummy-$(openssl rand -hex 16)
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          BETTER_AUTH_URL=http://localhost:3000
          ENV
      - run: npm run qa
